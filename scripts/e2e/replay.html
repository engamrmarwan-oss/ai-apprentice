<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Replay target</title>
<style>html,body{margin:0;height:100%;background:#fff;overflow:hidden}img{position:fixed;inset:0;width:100vw;height:100vh;object-fit:fill}</style>
</head>
<body>
<img id="frame" alt="">
<script>
// Shows the frames of a recorded session at the times they were recorded, so that a tab can stand in for the tool.
let manifest = null;
const ready = fetch("manifest.json").then((r) => r.json()).then(async (m) => {
  manifest = m;
  await Promise.all(m.frames.map((f) => new Promise((done) => { const i = new Image(); i.onload = i.onerror = done; i.src = f.file; f.image = i; })));
  document.getElementById("frame").src = m.frames[0].file;
});
window.startReplay = async (untilMs, speed = 1) => {
  await ready;
  const started = performance.now();
  const first = manifest.frames[0].t_ms;
  for (const frame of manifest.frames) {
    if (frame.t_ms > untilMs) break;
    const wait = (frame.t_ms - first) / speed - (performance.now() - started);
    if (wait > 0) await new Promise((r) => setTimeout(r, wait));
    document.getElementById("frame").src = frame.file;
    window.shown = frame.file;
  }
  window.replayDone = true;
};
</script>
</body>
</html>
